name: Ship rootfs to release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: source run id
        required: true
jobs:
  ship:
    runs-on: ubuntu-24.04
    steps:
      - name: copy artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: gerard1221/linux-zhiyu-rootfs-builder
          RUNID: ${{ inputs.run_id }}
          TAG: rootfs-run-42223129091
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          if ! gh run download "$RUNID" -n alarm-aarch64-kde-rootfs -D out; then echo "::error::download failed"; exit 1; fi
          ls -l out
          if ! gh release create "$TAG" out/* --title "rootfs run $RUNID" --notes "copied artifact"; then echo "::error::release create failed"; exit 1; fi
          echo SHIPPED
