name: Ship rootfs to release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: source run id
        required: true
jobs:
  ship:
    runs-on: ubuntu-24.04
    steps:
      - name: copy artifact to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" -n alarm-aarch64-kde-rootfs -D out
          ls -l out
          gh release create "rootfs-run-${{ inputs.run_id }}" out/* --title "rootfs run ${{ inputs.run_id }}" --notes "copied artifact from run ${{ inputs.run_id }}"
